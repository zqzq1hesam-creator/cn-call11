name: Cloudflare main build check

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - ".github/workflows/cloudflare-main-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - ".github/workflows/cloudflare-main-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Resolve Cloudflare Worker dependencies
        run: uv sync

      - name: Compile application Python
        run: python -m compileall -q cloudflare

      - name: Build the CN CALL Worker bundle without deploying
        run: uv run pywrangler deploy --dry-run

      - name: Smoke-test the Worker entry and safe maintenance response
        # Wrangler requires a local Hyperdrive URL during local dev. The app
        # remains in maintenance mode in CI because Firebase/LiveKit secrets are
        # intentionally absent, so this placeholder is never connected to.
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgres://local-dev:local-dev@127.0.0.1:5432/cncall_local"
        shell: bash
        run: |
          set -euo pipefail
          uv run pywrangler dev --ip 127.0.0.1 --port 8787 > /tmp/cn-call11-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/cn-call11-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/cn-call11-worker.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/cn-call11-worker.log
            echo "Worker did not become ready."
            exit 1
          fi

          cat /tmp/cn-call11-health.json
          python -c 'import json; d=json.load(open("/tmp/cn-call11-health.json")); assert d["status"] == "maintenance"; assert d["ready"] is False; print("CLOUDFLARE_ENTRY_HEALTH_OK")'
      - name: Diagnose live Cloudflare Worker deployment (non-blocking)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -u
          URL="https://cn-call11.zqzq1hesam-cncall.workers.dev/health"
          EXPECTED="2026-10-27-register-diagnostics-v1"
          BODY="/tmp/cn-call11-production-health.json"
          echo "Expected production backend version: $EXPECTED"
          for attempt in $(seq 1 3); do
            CODE="$(curl --silent --show-error --max-time 8 -o "$BODY" -w '%{http_code}' "$URL" 2>/tmp/cn-call11-production-curl.err || true)"
            echo "Attempt=$attempt HTTP=$CODE"
            if [ -s "$BODY" ]; then
              cat "$BODY"
              echo
              VERSION="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("backend_version", ""))' "$BODY" 2>/dev/null || true)"
              READY="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("ready", "")).lower())' "$BODY" 2>/dev/null || true)"
              echo "Observed backend_version=$VERSION ready=$READY"
              if [ "$CODE" = "200" ] && [ "$VERSION" = "$EXPECTED" ]; then
                echo "PRODUCTION_VERSION_MATCH"
                exit 0
              fi
            else
              cat /tmp/cn-call11-production-curl.err || true
            fi
            sleep 2
          done
          echo "PRODUCTION_VERSION_NOT_CONFIRMED; worker may not yet have deployed or production health is unavailable."

