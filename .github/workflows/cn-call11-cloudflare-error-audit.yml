name: CN CALL Cloudflare Error Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cn-call11-cloudflare-error-audit.yml"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Lookback hours (0.02-720; decimals allowed, 0.1 = 6 minutes)"
        required: false
        default: "168"
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query Cloudflare Workers Observability (read-only)
        shell: bash
        env:
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '168' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_OBSERVABILITY_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add CLOUDFLARE_OBSERVABILITY_API_TOKEN and verify CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets. No secret values were printed."
            exit 1
          fi
          python - <<'PY'
          import collections
          import datetime as dt
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CLOUDFLARE_OBSERVABILITY_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          try:
              hours = float(os.environ.get("LOOKBACK_HOURS", "168"))
          except (TypeError, ValueError):
              hours = 168.0
          # Permit focused post-deploy checks while preserving the old hour input.
          hours = max(1 / 60, min(hours, 720.0))

          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(hours=hours)
          base = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/observability/telemetry"

          def scrub(value):
              s = str(value or "")
              s = re.sub(r"https?://[^\s\"']+", "<url>", s)
              s = re.sub(r"(?i)\b[\w.+%-]+@[\w.-]+\.[A-Z]{2,}\b", "<email>", s)
              s = re.sub(r"(?i)\b(authorization|token|secret|password|api[_ -]?key)\s*[:=]\s*[^,;\s]+", r"\1=<redacted>", s)
              s = re.sub(r"(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b", "<uuid>", s)
              s = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "<ip>", s)
              s = re.sub(r"\b\+?\d[\d\s().-]{7,}\d\b", "<number>", s)
              s = re.sub(r"\b\d{6,}\b", "<id>", s)
              s = re.sub(r"\b[a-f0-9]{24,}\b", "<opaque>", s, flags=re.I)
              return " ".join(s.split())[:180]

          def api_post(path, body):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                      payload = json.loads(response.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      error_payload = json.loads(raw)
                      errors = error_payload.get("errors") or []
                      details = "; ".join(
                          scrub(x.get("message", x.get("code", "Cloudflare API error")))
                          for x in errors[:3] if isinstance(x, dict)
                      )
                  except Exception:
                      details = "Cloudflare returned a non-JSON error body."
                  print("CLOUDFLARE_API_HTTP_STATUS=" + str(exc.code))
                  if details:
                      print("CLOUDFLARE_API_ERROR=" + details)
                  if exc.code in (401, 403):
                      print("AUTH_HINT=The token may lack Workers Observability Write permission.")
                  raise SystemExit(2)
              except Exception as exc:
                  print("CLOUDFLARE_API_TRANSPORT_ERROR=" + scrub(type(exc).__name__ + ": " + str(exc)))
                  raise SystemExit(3)
              if not payload.get("success", False):
                  errors = payload.get("errors") or []
                  print("CLOUDFLARE_API_SUCCESS=false")
                  for err in errors[:3]:
                      if isinstance(err, dict):
                          print("CLOUDFLARE_API_ERROR=" + scrub(err.get("message", err.get("code", "Unknown error"))))
                  raise SystemExit(4)
              return payload

          service_filter = {
              "key": "$metadata.service",
              "operation": "eq",
              "type": "string",
              "value": "cn-call11",
          }
          error_group = {
              "kind": "group",
              "filterCombination": "or",
              "filters": [
                  {"key": "$metadata.level", "operation": "eq", "type": "string", "value": "error"},
                  {"key": "$metadata.level", "operation": "eq", "type": "string", "value": "fatal"},
                  {"key": "$metadata.level", "operation": "eq", "type": "string", "value": "critical"},
                  {"key": "$metadata.error", "operation": "exists", "type": "string"},
              ],
          }

          print("CLOUDFLARE_WORKER=cn-call11")
          print("LOOKBACK_HOURS=" + format(hours, "g"))
          print("TIMEFRAME_UTC=" + start.isoformat() + " to " + now.isoformat())
          print("RAW_LOG_LINES=NOT_PRINTED")

          limit = 2000
          all_events = []
          total_reported = 0
          cursor = None
          for page in range(5):
              body = {
                  "queryId": "cn-call11-error-audit-readonly",
                  "timeframe": {
                      "from": int(start.timestamp() * 1000),
                      "to": int(now.timestamp() * 1000),
                  },
                  "view": "events",
                  "limit": limit,
                  "dry": True,
                  "parameters": {
                      "datasets": ["cloudflare-workers"],
                      "filterCombination": "and",
                      "filters": [service_filter, error_group],
                  },
              }
              if cursor:
                  body["offset"] = cursor
                  body["offsetDirection"] = "next"
              data = api_post("/query", body)
              result = data.get("result") or {}
              event_block = result.get("events") or {}
              events = event_block.get("events") or []
              try:
                  total_reported = max(total_reported, int(event_block.get("count") or 0))
              except (TypeError, ValueError):
                  pass
              if not events:
                  break
              all_events.extend(events)
              last_id = (events[-1].get("$metadata") or {}).get("id")
              if len(events) < limit or not last_id:
                  break
              cursor = last_id

          def metadata_of(event):
              m = event.get("$metadata") or {}
              source = event.get("source")
              if isinstance(source, dict):
                  for k in ("level", "error", "errorTemplate", "message", "messageTemplate", "statusCode", "trigger", "service"):
                      if not m.get(k) and source.get(k) is not None:
                          m[k] = source.get(k)
              return m

          def event_timestamp(event):
              # Telemetry schemas may expose the event clock at the top level
              # or inside $metadata. Parse only known timestamp field names.
              candidates = []
              for section_name, section in (
                  ("event", event),
                  ("metadata", event.get("$metadata") or {}),
                  ("workers", event.get("$workers") or {}),
              ):
                  if not isinstance(section, dict):
                      continue
                  for key in ("timestamp", "datetime", "eventTimestamp", "time", "@timestamp"):
                      value = section.get(key)
                      if value is None or value == "":
                          continue
                      observed_timestamp_fields[section_name + "." + key] += 1
                      candidates.append(value)
              for value in candidates:
                  try:
                      if isinstance(value, (int, float)):
                          seconds = float(value) / 1000 if float(value) > 10_000_000_000 else float(value)
                          return dt.datetime.fromtimestamp(seconds, tz=dt.timezone.utc)
                      raw = str(value).strip()
                      if raw.endswith("Z"):
                          raw = raw[:-1] + "+00:00"
                      parsed = dt.datetime.fromisoformat(raw)
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=dt.timezone.utc)
                      return parsed.astimezone(dt.timezone.utc)
                  except (TypeError, ValueError, OverflowError, OSError):
                      continue
              return None

          levels = collections.Counter()
          outcomes = collections.Counter()
          signatures = collections.Counter()
          root_exceptions = collections.Counter()
          root_exception_last_seen = {}
          observed_timestamp_fields = collections.Counter()
          matched_event_times = []
          status_codes = collections.Counter()
          trigger_statuses = collections.Counter()
          failed_request_ids = set()
          invocations_failed = 0
          fatal_critical = 0
          error_records = 0
          routes = collections.Counter()

          known_bad_outcomes = {
              "exception", "exceededcpu", "scriptnotfound", "canceled",
              "cancelled", "memorylimitexceeded", "walltimeexceeded",
              "timelimitexceeded", "killswitch",
          }
          root_exception_re = re.compile(
              r"^(?:[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*(?:Error|Exception|Timeout|Fault|Failure|Disconnect|Rejected)|WebSocketDisconnect|HTTPException)(?::.*)?$"
          )

          def is_stack_frame_line(value):
              line = str(value or "").strip()
              if not line:
                  return True
              return bool(
                  line.startswith((
                      "Traceback (most recent call last):",
                      'File "',
                      "File '",
                      "During handling of the above exception",
                      "The above exception was the direct cause",
                  ))
                  or re.match(
                      r"^(?:await|raise|return|pass|try|except|finally|if|elif|else|for|while|with|async with|async for|yield|break|continue)\b",
                      line,
                  )
                  or re.match(r"^(?:GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\s+/", line)
                  or re.fullmatch(r"[\^~|()\[\]{},]+", line)
              )

          def useful_signature(values):
              candidates = []
              for value in values:
                  if value is None:
                      continue
                  if isinstance(value, dict):
                      value = value.get("error") or value.get("message") or value.get("detail") or ""
                  lines = [line.strip() for line in str(value).splitlines() if line.strip()]
                  if lines:
                      candidates.append(lines)

              # Prefer an actual exception class/message over any traceback frame.
              for lines in candidates:
                  for line in reversed(lines):
                      if root_exception_re.match(line) and not is_stack_frame_line(line):
                          return scrub(line), True

              # Otherwise keep the first meaningful message, skipping traceback frames,
              # source-code lines, and HTTP trigger labels that are not root causes.
              for lines in candidates:
                  for line in reversed(lines):
                      if not is_stack_frame_line(line):
                          return scrub(line), False
              return None, False

          for event in all_events:
              event_time = event_timestamp(event)
              if event_time is not None:
                  matched_event_times.append(event_time)
              meta = metadata_of(event)
              worker = event.get("$workers") or {}
              source = event.get("source")
              level = str(meta.get("level") or "").lower()
              outcome = str(worker.get("outcome") or meta.get("outcome") or "").lower()
              if level:
                  levels[level] += 1
              if outcome:
                  outcomes[outcome] += 1
              if outcome in known_bad_outcomes:
                  invocations_failed += 1
                  request_id = (
                      meta.get("requestId")
                      or meta.get("traceId")
                      or worker.get("requestId")
                      or worker.get("traceId")
                  )
                  if request_id:
                      failed_request_ids.add(str(request_id))
              if level in ("fatal", "critical"):
                  fatal_critical += 1

              trigger = str(meta.get("trigger") or "")
              if trigger:
                  trigger = re.sub(r"https?://[^\s]+", "<url>", trigger)
                  trigger = re.sub(r"\b[0-9a-f-]{16,}\b", "<id>", trigger, flags=re.I)
                  trigger = re.sub(r"\b\d{6,}\b", "<id>", trigger)
                  trigger = trigger[:100]

              status_code = meta.get("statusCode") or worker.get("statusCode")
              if status_code is not None:
                  status_codes[str(status_code)] += 1
                  if trigger:
                      trigger_statuses[(trigger, str(status_code))] += 1

              source_error = source.get("error") if isinstance(source, dict) else None
              source_message = source.get("message") if isinstance(source, dict) else None
              source_text = source if isinstance(source, str) else ""
              error_value = meta.get("error") or source_error
              is_error = (
                  level in ("error", "fatal", "critical")
                  or bool(error_value)
                  or outcome in known_bad_outcomes
                  or bool(re.search(r"(?i)\b(fatal error|uncaught exception|traceback|unhandled exception)\b", source_text))
              )
              if not is_error:
                  continue
              error_records += 1

              signature, is_root_exception = useful_signature([
                  meta.get("errorTemplate"),
                  error_value,
                  source_message,
                  meta.get("message"),
                  meta.get("messageTemplate"),
                  source_text,
              ])
              if signature:
                  signatures[signature] += 1
                  if is_root_exception:
                      root_exceptions[signature] += 1
                      if event_time is not None:
                          prev = root_exception_last_seen.get(signature)
                          if prev is None or event_time > prev:
                              root_exception_last_seen[signature] = event_time
              trigger_label = trigger or "(trigger unavailable)"
              routes[trigger_label] += 1

          print("QUERY_SUCCESS=true")
          print("EVENTS_RETURNED=" + str(len(all_events)))
          print("EVENTS_MATCHED_REPORTED=" + str(total_reported))
          print("ERROR_LOG_EVENTS_CLASSIFIED=" + str(error_records))
          print("FATAL_OR_CRITICAL_LOG_EVENTS=" + str(fatal_critical))
          print("EVENTS_WITH_FAILED_OUTCOME=" + str(invocations_failed))
          print("DISTINCT_FAILED_REQUEST_IDS=" + str(len(failed_request_ids)))
          print("LEVEL_COUNTS=" + json.dumps(dict(levels.most_common()), sort_keys=True))
          print("OUTCOME_COUNTS=" + json.dumps(dict(outcomes.most_common()), sort_keys=True))
          print("ERROR_LOG_STATUS_CODE_COUNTS=" + json.dumps(dict(status_codes.most_common()), sort_keys=True))
          if matched_event_times:
              print("MATCHED_EVENT_TIME_RANGE_UTC=" + min(matched_event_times).isoformat() + " to " + max(matched_event_times).isoformat())
          else:
              print("MATCHED_EVENT_TIME_RANGE_UTC=unavailable_in_telemetry_fields")
          if observed_timestamp_fields:
              print("OBSERVED_TIMESTAMP_FIELD_COUNTS=" + json.dumps(dict(observed_timestamp_fields.most_common()), sort_keys=True))
          else:
              print("OBSERVED_TIMESTAMP_FIELD_COUNTS={}")
          if total_reported > len(all_events):
              print("NOTE=Result count exceeds collected events; query pagination or API limits may have capped the sample.")
          print("NOTE=Event/log counts are not equivalent to unique failed calls.")
          print("TOP_ROOT_EXCEPTION_SIGNATURES_BEGIN")
          for signature, count in root_exceptions.most_common(20):
              latest = root_exception_last_seen.get(signature)
              latest_label = latest.isoformat() if latest is not None else "timestamp-unavailable"
              print(str(count) + "x | last_seen_utc=" + latest_label + " | " + signature)
          if not root_exceptions:
              print("No explicit exception class/message was extracted from matched events.")
          print("TOP_ROOT_EXCEPTION_SIGNATURES_END")
          print("TOP_ERROR_MESSAGE_SIGNATURES_BEGIN")
          for signature, count in signatures.most_common(20):
              print(str(count) + "x | " + signature)
          if not signatures:
              print("No non-stack-frame error messages were extracted.")
          print("TOP_ERROR_MESSAGE_SIGNATURES_END")
          if trigger_statuses:
              print("TOP_TRIGGER_STATUS_CODES_BEGIN")
              for (trigger, status), count in trigger_statuses.most_common(20):
                  print(str(count) + "x | status=" + status + " | " + scrub(trigger))
              print("TOP_TRIGGER_STATUS_CODES_END")
          if routes:
              print("TOP_ERROR_TRIGGER_LOG_COUNTS_BEGIN")
              for route, count in routes.most_common(10):
                  print(str(count) + " log-events | " + scrub(route))
              print("TOP_ERROR_TRIGGER_LOG_COUNTS_END")
          print("AUDIT_COMPLETE")
          PY