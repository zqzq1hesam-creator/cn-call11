name: Cloudflare Free preflight

on:
  push:
    branches:
      - cloudflare-free-migration
    paths:
      - "cloudflare-free/**"
      - ".github/workflows/cloudflare-free-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-free
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Resolve Worker dependencies
        run: uv sync

      - name: Build Cloudflare Worker bundle without deploying
        run: uv run pywrangler deploy --dry-run
