name: Cloudflare WebSocket production smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-websocket-smoke.yml"
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://cn-call11.zqzq1hesam-cncall.workers.dev/health" \
            -o /tmp/cn-call11-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/cn-call11-health.json").read_text())
          print(json.dumps(data, ensure_ascii=False))
          assert data.get("ready") is True, "Worker health is not ready"
          assert data.get("database") == "ok", "Database is not healthy"
          assert data.get("backend_version") == "2026-10-27-register-pbkdf2-100k-v2", "Unexpected production version"
          PY

      - name: Verify authenticated WebSocket protocol reaches the FastAPI route
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Connect to production WSS and verify server frame
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = "wss://cn-call11.zqzq1hesam-cncall.workers.dev/ws/000000000000?token=invalid-production-smoke-token";
          await new Promise((resolve, reject) => {
            let completed = false;
            const finish = (err) => {
              if (completed) return;
              completed = true;
              clearTimeout(timer);
              try { ws.close(); } catch {}
              err ? reject(err) : resolve();
            };
            const ws = new WebSocket(url);
            const timer = setTimeout(() => finish(new Error("Timed out waiting for the expected session_invalid frame")), 15000);
            ws.addEventListener("open", () => console.log("WSS_OPEN"));
            ws.addEventListener("message", (event) => {
              const raw = String(event.data);
              console.log("WSS_MESSAGE=" + raw);
              let data;
              try { data = JSON.parse(raw); } catch { return finish(new Error("Server sent a non-JSON WebSocket frame")); }
              if (data.type === "session_invalid" && data.reason === "invalid_session") {
                console.log("WSS_ASGI_ROUTE_VERIFIED");
                finish();
              } else {
                finish(new Error("Unexpected WebSocket protocol response: " + raw));
              }
            });
            ws.addEventListener("error", () => {
              if (!completed) finish(new Error("Could not establish the production WebSocket handshake"));
            });
            ws.addEventListener("close", (event) => {
              if (!completed) finish(new Error("WebSocket closed before session_invalid; code=" + event.code + " reason=" + event.reason));
            });
          });
          NODE
