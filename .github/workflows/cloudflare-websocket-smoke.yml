name: Cloudflare WebSocket production smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-websocket-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://cn-call11.zqzq1hesam-cncall.workers.dev/health" \
            -o /tmp/cn-call11-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/cn-call11-health.json").read_text())
          print(json.dumps(data, ensure_ascii=False))
          assert data.get("ready") is True, "Worker health is not ready"
          assert data.get("database") == "ok", "Database is not healthy"
          print("BACKEND_VERSION=" + str(data.get("backend_version", "<missing>")))
          PY

      - name: Verify authenticated WebSocket protocol reaches the FastAPI route
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Connect to production WSS and verify server frame
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save ws@8
          node <<'NODE'
          const WebSocket = require("ws");
          const url = "wss://cn-call11.zqzq1hesam-cncall.workers.dev/ws/000000000000?token=invalid-production-smoke-token";
          new Promise((resolve, reject) => {
            let done = false;
            const finish = (error) => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              try { ws.close(); } catch {}
              error ? reject(error) : resolve();
            };
            const ws = new WebSocket(url, { handshakeTimeout: 15000 });
            const timer = setTimeout(() => finish(new Error("Timed out waiting for session_invalid")), 17000);
            ws.on("open", () => console.log("WSS_OPEN"));
            ws.on("message", (raw) => {
              const text = raw.toString();
              console.log("WSS_MESSAGE=" + text);
              let data;
              try { data = JSON.parse(text); }
              catch { return finish(new Error("Server returned non-JSON WebSocket frame: " + text)); }
              if (data.type === "session_invalid" && data.reason === "invalid_session") {
                console.log("WSS_ASGI_ROUTE_VERIFIED");
                return finish();
              }
              return finish(new Error("Unexpected WebSocket protocol response: " + text));
            });
            ws.on("unexpected-response", (request, response) => {
              let body = "";
              response.on("data", chunk => body += chunk.toString());
              response.on("end", () => {
                console.error("WSS_UNEXPECTED_HTTP_STATUS=" + response.statusCode);
                console.error("WSS_UNEXPECTED_HTTP_BODY=" + body.slice(0, 2000));
                finish(new Error("WebSocket upgrade was rejected with HTTP " + response.statusCode));
              });
            });
            ws.on("error", (error) => {
              if (!done) finish(new Error("WebSocket transport/handshake failed: " + error.message));
            });
            ws.on("close", (code, reason) => {
              if (!done) finish(new Error("WebSocket closed before session_invalid; code=" + code + " reason=" + reason.toString()));
            });
          }).catch(error => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE
