name: CN CALL Android Universal Release

on:
  push:
    branches: [main, feature/telecom-video]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build universal release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify and package universal APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          APK="$OUT/app-release.apk"
          ZIP="$OUT/cn-call11-universal-release.zip"

          test -f "$APK"

          # Verify the final merged/built APK has exactly one FCM receiver
          # for com.google.firebase.MESSAGING_EVENT. This catches manifest
          # merge regressions that source-file inspection cannot see.
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1)"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest print "$APK" > /tmp/merged-manifest.txt
          MESSAGING_EVENT_COUNT="$(grep -c 'com.google.firebase.MESSAGING_EVENT' /tmp/merged-manifest.txt || true)"
          test "$MESSAGING_EVENT_COUNT" -eq 1
          grep -F 'com.example.mobile.CallFirebaseService' /tmp/merged-manifest.txt
          ! grep -F 'io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService' /tmp/merged-manifest.txt
          ! grep -F 'com.google.firebase.messaging.FirebaseMessagingService' /tmp/merged-manifest.txt
          echo "FCM_SINGLE_RECEIVER_OK"

          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1

          unzip -Z1 "$APK" > /tmp/apk-files.txt

          grep -Fx 'lib/armeabi-v7a/libflutter.so' /tmp/apk-files.txt
          grep -Fx 'lib/arm64-v8a/libflutter.so' /tmp/apk-files.txt
          grep -Fx 'lib/x86_64/libflutter.so' /tmp/apk-files.txt

          rm -f "$ZIP"
          zip -9 -j "$ZIP" "$APK"

          test "$(unzip -Z1 "$ZIP" | wc -l)" -eq 1
          test "$(unzip -Z1 "$ZIP")" = "app-release.apk"

          echo "UNIVERSAL_APK_ZIP_OK"
          ls -lh "$APK" "$ZIP"
          unzip -Z1 "$APK" | grep '^lib/.*[.]so$' | sort
          unzip -l "$ZIP"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-universal-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload universal ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-universal-release-zip
          path: mobile/build/app/outputs/flutter-apk/cn-call11-universal-release.zip
          if-no-files-found: error
          compression-level: 9
