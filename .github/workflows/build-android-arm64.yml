name: CN CALL Android arm64 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-v8a:
    name: Build Release APK (arm64-v8a only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build arm64-v8a release split APK
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify arm64-only output
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/app/outputs/flutter-apk"
          ARM64="$OUT/app-arm64-v8a-release.apk"

          test -f "$ARM64"

          mapfile -t APKS < <(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print)

          echo "APK files:"
          printf '%s\n' "${APKS[@]}"

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found ${#APKS[@]}"
            exit 1
          fi

          if [ "${APKS[0]}" != "$ARM64" ]; then
            echo "ERROR: Output is not arm64-v8a: ${APKS[0]}"
            exit 1
          fi

          echo "ARM64_V8A_ONLY_OK"

      - name: Prepare zip containing only arm64-v8a APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/app/outputs/flutter-apk"
          PKG="cn-call11-arm64-v8a-release"
          DIR="build/release-package"

          rm -rf "$DIR"
          mkdir -p "$DIR"

          cp "$OUT/app-arm64-v8a-release.apk" "$DIR/"

          zip -9 "$OUT/$PKG.zip" -j "$DIR/app-arm64-v8a-release.apk"

          unzip -l "$OUT/$PKG.zip"

          COUNT="$(unzip -Z1 "$OUT/$PKG.zip" | grep -c '^app-arm64-v8a-release\.apk

          if [ "$COUNT" -ne 1 ] || [ "$TOTAL" -ne 1 ]; then
            echo "ERROR: ZIP must contain exactly one file: app-arm64-v8a-release.apk"
            exit 1
          fi

          echo "ARM64_ZIP_ONLY_OK"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: cn-call11-arm64-v8a-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload arm64-v8a ZIP
        uses: actions/upload-artifact@v7
        with:
          name: cn-call11-arm64-v8a-release-zip
          path: mobile/build/app/outputs/cn-call11-arm64-v8a-release.zip
          if-no-files-found: error
          compression-level: 0
 || true)"
          TOTAL="$(unzip -Z1 "$OUT/$PKG.zip" | wc -l)"

          if [ "$COUNT" -ne 1 ] || [ "$TOTAL" -ne 1 ]; then
            echo "ERROR: ZIP must contain exactly one file: app-arm64-v8a-release.apk"
            exit 1
          fi

          echo "ARM64_ZIP_ONLY_OK"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: cn-call11-arm64-v8a-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload arm64-v8a ZIP
        uses: actions/upload-artifact@v7
        with:
          name: cn-call11-arm64-v8a-release-zip
          path: mobile/build/app/outputs/cn-call11-arm64-v8a-release.zip
          if-no-files-found: error
          compression-level: 0
