name: CN CALL Android Universal Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build universal release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify universal APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          APK="$OUT/app-release.apk"

          test -f "$APK"

          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1

          unzip -Z1 "$APK" > /tmp/apk-files.txt

          grep -Fx 'lib/armeabi-v7a/libflutter.so' /tmp/apk-files.txt
          grep -Fx 'lib/arm64-v8a/libflutter.so' /tmp/apk-files.txt
          grep -Fx 'lib/x86_64/libflutter.so' /tmp/apk-files.txt

          echo "UNIVERSAL_APK_OK"
          ls -lh "$APK"
          unzip -Z1 "$APK" | grep '^lib/.*\.so$' | sort

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-universal-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
