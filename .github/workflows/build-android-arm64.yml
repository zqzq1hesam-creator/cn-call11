name: CN CALL Android Universal Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build universal release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify and package universal APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          APK="$OUT/app-release.apk"
          ZIP="$OUT/cn-call11-universal-release.zip"

          test -f "$APK"
          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1
          test "$APK_COUNT" -eq 1
          test "$(find "$OUT" -maxdepth 1 -type f -name '*.apk' -printf '%f\n')" = "app-release.apk"

          rm -f "$ZIP"
          zip -9 -j "$ZIP" "$APK"

          test "$(unzip -Z1 "$ZIP" | wc -l)" -eq 1
          test "$(unzip -Z1 "$ZIP")" = "app-release.apk"

          echo "UNIVERSAL_APK_OK"
          unzip -l "$ZIP"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-universal-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload universal ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-universal-release-zip
          path: mobile/build/app/outputs/flutter-apk/cn-call11-universal-release.zip
          if-no-files-found: error
          compression-level: 0
