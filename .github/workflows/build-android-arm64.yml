name: CN CALL Android All Architectures Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build all supported Android ABIs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Verify and package all ABIs
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          ZIP="$OUT/cn-call11-all-architectures-release.zip"

          for apk in             "$OUT/app-armeabi-v7a-release.apk"             "$OUT/app-arm64-v8a-release.apk"             "$OUT/app-x86_64-release.apk"
          do
            test -f "$apk"
          done

          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 3

          rm -f "$ZIP"
          zip -9 -j "$ZIP"             "$OUT/app-armeabi-v7a-release.apk"             "$OUT/app-arm64-v8a-release.apk"             "$OUT/app-x86_64-release.apk"

          test "$(unzip -Z1 "$ZIP" | wc -l)" -eq 3
          unzip -Z1 "$ZIP" | sort | diff -u - <(
            printf '%s\n'               "app-arm64-v8a-release.apk"               "app-armeabi-v7a-release.apk"               "app-x86_64-release.apk" | sort
          )

          echo "ALL_SUPPORTED_ABIS_OK"
          unzip -l "$ZIP"

      - name: Upload all-architectures APKs
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-all-architectures-release-apks
          path: |
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload all-architectures ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cn-call11-all-architectures-release-zip
          path: mobile/build/app/outputs/flutter-apk/cn-call11-all-architectures-release.zip
          if-no-files-found: error
          compression-level: 0
