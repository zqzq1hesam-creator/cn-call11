name: Deploy CN CALL Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Verify deployment secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add a scoped Cloudflare Workers deployment API token in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Add the Cloudflare account ID in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare deployment credentials are present (values not printed)."

      - name: Resolve Python Worker deployment dependencies
        run: uv sync

      - name: Compile backend Python before deployment
        run: python -m compileall -q cloudflare

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cn-call11.zqzq1hesam-cncall.workers.dev/health"
          BODY="/tmp/cn-call11-production-health.json"

          for attempt in $(seq 1 20); do
            CODE="$(curl --silent --show-error --max-time 10 -o "$BODY" -w '%{http_code}' "$URL" || true)"
            VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("backend_version", ""))' "$BODY" 2>/dev/null || true)"
            READY="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("ready", False)).lower())' "$BODY" 2>/dev/null || true)"
            DATABASE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("database", ""))' "$BODY" 2>/dev/null || true)"
            echo "Attempt=$attempt HTTP=$CODE ready=$READY database=$DATABASE backend_version=${VERSION:-<missing>}"
            if [ "$CODE" = "200" ] && [ "$READY" = "true" ] && [ "$DATABASE" = "ok" ]; then
              cat "$BODY"
              echo "CLOUDFLARE_PRODUCTION_HEALTH_VERIFIED"
              exit 0
            fi
            sleep 3
          done

          echo "::error::Production health endpoint did not become ready with a healthy database."
          if [ -f "$BODY" ]; then cat "$BODY"; fi
          exit 1

      - name: Verify production WebSocket signaling route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cn-call11-ws-smoke
          npm install --prefix /tmp/cn-call11-ws-smoke --no-save --package-lock=false ws@8
          NODE_PATH=/tmp/cn-call11-ws-smoke/node_modules node <<'NODE'
          const WebSocket = require("ws");
          const url = "wss://cn-call11.zqzq1hesam-cncall.workers.dev/ws/000000000000?token=invalid-production-smoke-token";
          new Promise((resolve, reject) => {
            let done = false;
            const finish = (error) => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              try { ws.close(); } catch {}
              error ? reject(error) : resolve();
            };
            const ws = new WebSocket(url, { handshakeTimeout: 15000 });
            const timer = setTimeout(() => finish(new Error("Timed out waiting for session_invalid")), 17000);
            ws.on("open", () => console.log("WSS_OPEN"));
            ws.on("message", (raw) => {
              const message = raw.toString();
              console.log("WSS_MESSAGE=" + message);
              let data;
              try { data = JSON.parse(message); }
              catch { return finish(new Error("Non-JSON WebSocket frame received")); }
              if (data.type === "session_invalid" && data.reason === "invalid_session") {
                console.log("WSS_ASGI_ROUTE_VERIFIED");
                return finish();
              }
              return finish(new Error("Unexpected WebSocket response: " + message));
            });
            ws.on("unexpected-response", (request, response) => {
              let body = "";
              response.on("data", chunk => body += chunk.toString());
              response.on("end", () => {
                console.error("WSS_UNEXPECTED_HTTP_STATUS=" + response.statusCode);
                console.error("WSS_UNEXPECTED_HTTP_BODY=" + body.slice(0, 2000));
                finish(new Error("WebSocket upgrade rejected with HTTP " + response.statusCode));
              });
            });
            ws.on("error", (error) => {
              if (!done) finish(new Error("WebSocket handshake failed: " + error.message));
            });
            ws.on("close", (code, reason) => {
              if (!done) finish(new Error("Closed before session_invalid; code=" + code + " reason=" + reason.toString()));
            });
          }).catch((error) => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE
